<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuaderno de obra GDC</title>
<style>img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Sistema de diseño compartido con Concreto Armado 1 (UDEP): Clean SaaS / Shadcn UI */
:root{
  --ground:#f9fafb;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --hover:#f1f5f9;
  --ink:#111827;
  --ink2:#374151;
  --muted:#6b7280;
  --dim:#9ca3af;
  --line:#e5e7eb;
  --lineSoft:#f3f4f6;
  --brand:#004b87;
  --brandDeep:#003663;
  --brandSoft:#e6f0f8;
  --brandGlow:rgba(0,75,135,.12);
  --good:#059669;
  --goodText:#065f46;
  --goodSoft:#ecfdf5;
  --warn:#b45309;
  --warnText:#92400e;
  --warnSoft:#fffbeb;
  --crit:#dc2626;
  --critText:#991b1b;
  --critSoft:#fef2f2;
  --sh-xs:0 1px 2px 0 rgba(0,0,0,.05);
  --sh-sm:0 1px 3px 0 rgba(0,0,0,.08),0 1px 2px -1px rgba(0,0,0,.08);
  --sh-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink2);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:0 64px}
h1,h2,h3{margin:0;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--brandGlow);border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.subtle{color:var(--muted);font-size:.83rem}
[hidden]{display:none!important}

/* ---- barra superior institucional ---- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-xs);position:sticky;top:0;z-index:50}
.topbar .wrap{padding-block:0}
.brandrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:12px}
.udep{background:var(--brand);color:#fff;font-weight:700;font-size:.78rem;padding:6px 11px;border-radius:var(--r-sm);letter-spacing:.06em;box-shadow:var(--sh-xs)}
.brandrow h1{font-size:1.02rem;font-weight:600}
.sigla{font-family:var(--mono);font-size:.72rem;color:var(--brand);background:var(--brandSoft);border:1px solid rgba(0,75,135,.15);border-radius:9999px;padding:3px 10px;font-weight:600}
.brandrow .subtle{flex-basis:100%;margin-top:-6px;padding-left:66px}

.subhead .wrap{padding-block:0}
.hitos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-block:18px 14px}
.hito{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--sh-xs)}
.hito .k{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hito .v{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--brand);line-height:1.3;margin-top:2px}
.hito .n{font-size:.78rem;color:var(--muted)}
.hito.urg .v{color:var(--crit)}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;white-space:nowrap;color:var(--muted);font-size:.875rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:color .15s,border-color .15s}
.tab svg{width:16px;height:16px;flex:none}
.tab:hover{color:var(--ink);border-bottom-color:#cbd5e1}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* ---- tarjetas base ---- */
.card,.unidad,.plan,.ej,.carta,.tile,.lista,.examen,.headline,.hito{transition:box-shadow .2s}
.unidad{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden}
.unidad-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:0;border-bottom:1px solid var(--lineSoft);padding:14px 18px;background:var(--surface2);width:100%;text-align:left}
.unidad-h .cod{font-family:var(--mono);font-size:.78rem;color:var(--brand);font-weight:700;background:var(--brandSoft);border-radius:var(--r-sm);padding:3px 8px}
.unidad-h h2{font-size:.98rem;font-weight:600;flex:1}
.unidad-h .pct{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:600}
.unidad-h .caret{font-family:var(--mono);font-size:1rem;color:var(--brand);width:16px;text-align:center}

.fila{border-bottom:1px solid var(--lineSoft);background:var(--surface)}
.fila:last-child{border-bottom:0}
.fila-b{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 18px;transition:background .15s}
.fila-b:hover{background:var(--hover)}
.fila-b .cod{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.fila-b .tit{font-weight:500;color:var(--ink)}
.fila-b .sem{font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);display:block;margin-top:1px}
.medidor{display:flex;align-items:center;gap:8px}
.barra{width:84px;height:6px;background:#e2e8f0;border-radius:9999px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--brand);border-radius:9999px}
.medidor .p{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:34px;text-align:right}
.fila[data-open="true"]{background:var(--surface);box-shadow:inset 4px 0 0 var(--brand)}
.fila[data-open="true"] .fila-b{background:var(--brandSoft)}

.panel{padding:6px 18px 20px}
.panel h3{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin-bottom:5px}
.panel-u{background:var(--surface);border-bottom:1px solid var(--lineSoft)}
.panel-u .intro{margin:10px 0 0;max-width:76ch;color:var(--ink2)}
.cita{margin:12px 0 0;padding:12px 14px;border-left:4px solid var(--brand);background:var(--surface2);border-radius:0 var(--r-md) var(--r-md) 0;font-style:italic;color:var(--ink2);max-width:72ch}
.ruta{margin:0;padding-left:20px}
.ruta>li{margin-bottom:9px}
.ruta>li>b{font-weight:600;color:var(--ink)}
.ruta ul{margin:3px 0 0;padding-left:16px}
.ruta ul li{color:var(--ink2)}

.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.chk li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin:0;box-shadow:var(--sh-xs);transition:border-color .15s,background .15s}
.chk li:hover{border-color:#cbd5e1;background:var(--surface2)}
.chk button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:10px 12px;line-height:1.5;border-radius:var(--r-md)}
.mark{width:18px;height:18px;border:1.5px solid #cbd5e1;border-radius:4px;margin-top:2px;font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center;color:transparent;flex:none;background:#fff}
.chk li[data-s="1"]{border-color:rgba(217,119,6,.35);background:var(--warnSoft)}
.chk li[data-s="1"] .mark{border-color:var(--warn);color:var(--warn)}
.chk li[data-s="2"]{border-color:rgba(5,150,105,.3);background:var(--goodSoft)}
.chk li[data-s="2"] .mark{border-color:var(--good);background:var(--good);color:#fff}
.chk li[data-s="2"] .txt{color:var(--goodText)}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.leyenda span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;border:1.5px solid #cbd5e1;background:#fff}
.dot.e{background:var(--warnSoft);border-color:var(--warn)}
.dot.d{background:var(--good);border-color:var(--good)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72rem;font-weight:600;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9999px;padding:3px 10px;color:#475569;letter-spacing:.2px}
.chip.pdf::before{content:"PDF ";color:var(--crit)}

.linkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:600;font-size:.85rem;background:var(--brand);color:#fff;border:0;border-radius:var(--r-md);padding:9px 18px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--sh-sm);transition:background .15s,box-shadow .15s,transform .1s}
.btn:hover{background:var(--brandDeep);box-shadow:var(--sh-md)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--brandSoft);color:var(--brand);border:1px solid rgba(0,75,135,.2);box-shadow:none}
.btn.ghost:hover{background:var(--brand);color:#fff}
.btn.mini{padding:6px 12px;font-size:.78rem}
input[type="url"],input[type="text"],textarea,select{font-family:var(--body);font-size:.85rem;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;width:100%;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandGlow);outline:none}
select{height:38px;font-weight:500;cursor:pointer}
textarea{min-height:76px;resize:vertical}

/* ---- plan de práctica ---- */
.plan{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:18px 20px 16px;border-top:4px solid var(--brand)}
.plan-h h2{font-size:1.1rem;font-weight:600;margin-top:4px}
.plan .cita{margin-top:12px;font-size:.88rem}
.plan .cita a{display:block;margin-top:8px;font-style:normal;font-weight:600;font-size:.78rem;text-decoration:none}
.bloques{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.bloque{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-md);padding:12px 14px 10px}
.bloque-h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:6px}
.bloque-h b{font-weight:600;color:var(--ink);font-size:.9rem}
.bloque p{margin:0 0 10px;font-size:.83rem;color:var(--ink2)}
.bloque .est{font-size:.72rem;padding:4px 10px}

/* ---- banco de ejercicios ---- */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.filtros select{width:auto;min-width:200px}
.ej{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);margin-bottom:14px;overflow:hidden}
.ej:hover{box-shadow:var(--sh-md)}
.ej-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--lineSoft);background:var(--surface2)}
.ej-h .org{font-family:var(--mono);font-size:.72rem;color:var(--muted);flex:1;min-width:140px}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.3px;padding:3px 10px;border-radius:9999px;border:1px solid;display:inline-flex;align-items:center}
.tag.rec{color:var(--critText);border-color:rgba(220,38,38,.3);background:var(--critSoft)}
.tag.ver{color:var(--goodText);border-color:rgba(5,150,105,.25);background:var(--goodSoft)}
.tag.prop{color:var(--warnText);border-color:rgba(217,119,6,.3);background:var(--warnSoft)}
.tag.ex{color:var(--brand);border-color:rgba(0,75,135,.2);background:var(--brandSoft)}
.ej-body{padding:14px 16px}
.ej-body p{margin:0 0 10px;color:var(--ink)}
.ej-body ul{margin:0 0 8px;padding-left:18px}
.sol{margin-top:14px;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-md);padding:14px 16px}
.sol ol{margin:0;padding-left:20px}
.sol li{margin-bottom:7px;font-size:.88rem}
.resp{font-family:var(--mono);font-size:.95rem;font-weight:700;color:var(--brand);background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 14px;margin-top:12px;display:inline-block;box-shadow:var(--sh-xs)}
.nota{font-size:.83rem;color:var(--warnText);background:var(--warnSoft);border:1px solid rgba(217,119,6,.25);border-radius:var(--r-md);padding:10px 14px;margin-top:12px;line-height:1.5}
.estados{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--lineSoft);background:var(--surface)}
.est{font-size:.78rem;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:6px 14px;color:var(--ink2);box-shadow:var(--sh-xs);transition:all .15s}
.est:hover{background:var(--surface2);border-color:#cbd5e1}
.est[aria-pressed="true"]{border-color:var(--good);background:var(--goodSoft);color:var(--goodText);font-weight:600}
.est.f[aria-pressed="true"]{border-color:var(--crit);background:var(--critSoft);color:var(--critText)}

/* ---- repaso ---- */
.carta{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:26px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.carta .q{font-size:1.1rem;font-weight:500;color:var(--ink);line-height:1.55}
.carta .a{border-top:1px solid var(--lineSoft);padding-top:12px;color:var(--ink2);background:var(--goodSoft);margin:0 -26px -26px;padding:14px 26px 22px;border-radius:0 0 var(--r-lg) var(--r-lg);color:var(--goodText)}
.contador{font-family:var(--mono);font-size:.78rem;color:var(--muted)}

/* ---- avance ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-xs)}
.tile .k{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--brand);line-height:1.1;margin-top:4px}
.lista{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-xs)}
.lista .r{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--lineSoft)}
.lista .r:last-child{border-bottom:0}
.lista .r:hover{background:var(--surface2)}
.lista .r .t{flex:1}
.vacio{color:var(--muted);padding:14px 12px;font-style:italic}
.marcas .r{text-decoration:none;color:inherit}
.marcas .r:hover{background:var(--brandSoft)}
.marcas .mm{color:var(--brand);font-weight:700;font-size:.78rem;min-width:52px}
.marcas .go{color:var(--brand)}

.tabla{width:100%;border-collapse:collapse;font-size:.85rem}
.tabla th{background:var(--surface2);padding:11px 14px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.3px}
.tabla td{padding:11px 14px;border-bottom:1px solid var(--line)}
.tabla tbody tr:hover{background:var(--surface2)}
.tabla td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.scroll-x{overflow-x:auto}

/* ---- matriz qué cae ---- */
.matriz{border-collapse:separate;border-spacing:3px;font-size:.82rem}
.matriz th{font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px;vertical-align:bottom}
.matriz th.eje{text-align:left;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink);font-weight:500;min-width:200px}
.matriz th .per{display:block;color:var(--ink);font-size:.75rem;font-family:var(--mono);text-transform:none;letter-spacing:0}
.matriz td{padding:0;text-align:center}
.celda{display:block;padding:8px 4px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--dim);border-radius:var(--r-sm);min-width:46px;border:1px solid var(--lineSoft)}
.celda.on{color:var(--ink);border-color:transparent}
.celda.alto{color:#fff}
.tot{display:flex;align-items:center;gap:8px;padding-left:6px}
.tot .b{height:8px;background:var(--brand);border-radius:9999px;min-width:3px}
.tot .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:600;color:var(--ink2);min-width:38px;text-align:right}
.headline{background:var(--brandSoft);border:1px solid rgba(0,75,135,.2);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:18px}
.headline .big{font-family:var(--mono);font-size:2.1rem;font-weight:700;color:var(--brand);line-height:1.1}
.headline p{margin:6px 0 0;color:var(--ink2);max-width:66ch}
.examen{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-xs);margin-bottom:10px;overflow:hidden}
.examen summary{padding:12px 16px;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;list-style:none}
.examen summary::-webkit-details-marker{display:none}
.examen summary:hover{background:var(--surface2)}
.examen summary h3{font-size:.92rem;font-weight:600;margin:0}
.examen summary .f{font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:1;min-width:120px}
.examen .qs{padding:0 16px 14px;border-top:1px solid var(--lineSoft)}
.examen .q{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--lineSoft)}
.examen .q:last-of-type{border-bottom:0}
.examen .q .p{font-family:var(--mono);font-size:.78rem;color:var(--brand);font-weight:700;text-decoration:none}
.examen .q a.p:hover{text-decoration:underline}
.examen .q .e{font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;font-weight:600}

/* ---- lo esencial ---- */
.esen{max-width:860px;margin:0 auto}
.esen-top{padding:26px 0 8px}
.esen-top h2{font-size:1.5rem;font-weight:700;margin-top:4px}
.esen-top p{color:var(--ink2);max-width:70ch;margin:8px 0 0}
.esen-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:20px 22px 18px;margin-top:18px}
.esen-card.cert-3{border-top:4px solid var(--brand)}
.esen-card.cert-2{border-top:4px solid #3b82f6}
.esen-card.cert-1{border-top:4px solid #94a3b8}
.esen-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.esen-h h3{font-size:1.02rem;font-weight:600;flex:1 1 320px}
.cert{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:9999px;background:var(--brandSoft);color:var(--brand);border:1px solid rgba(0,75,135,.2)}
.cert-2 .cert{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.cert-1 .cert{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.esen .why{margin:0 0 14px;color:var(--ink2);font-size:.9rem;border-left:3px solid var(--line);padding-left:12px}
.esen h4{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.formula{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--brand);background:var(--brandSoft);border:1px solid rgba(0,75,135,.2);border-radius:var(--r-md);padding:12px 16px;text-align:center;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px;margin-top:10px;font-size:.88rem}
.kv div{padding:6px 0;border-bottom:1px solid var(--lineSoft)}
.kv b{font-family:var(--mono);color:var(--brand);margin-right:6px}
.kv .num{font-weight:700;color:var(--ink)}
.pasos{margin:0;padding-left:22px}
.pasos li{margin-bottom:9px;font-size:.9rem}
.pasos .num{font-weight:600;background:var(--surface2);padding:1px 6px;border-radius:4px;font-size:.84rem}
.trampas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.trampas li{background:var(--warnSoft);border:1px solid rgba(217,119,6,.25);border-radius:var(--r-md);padding:8px 12px;font-size:.86rem;color:var(--warnText)}
.trampas li::before{content:"⚠ ";font-size:.8rem}
.esen .linkrow{margin-top:14px}
.resp-modelo{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;background:var(--surface);overflow:hidden}
.resp-modelo summary{padding:11px 14px;font-weight:600;font-size:.9rem;color:var(--ink);cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;background:var(--surface2)}
.resp-modelo summary::-webkit-details-marker{display:none}
.resp-modelo summary::before{content:"+";font-family:var(--mono);color:var(--brand);font-weight:700;width:14px}
.resp-modelo[open] summary::before{content:"−"}
.resp-modelo>div{padding:4px 14px 12px;font-size:.88rem;color:var(--ink2)}
.resp-modelo p{margin:8px 0 0}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.caja{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r-md);padding:12px 14px}
.caja h4{margin-top:0}
.caja p{margin:0 0 8px;font-size:.87rem;color:var(--ink2)}
.caja .tabla{font-size:.82rem;margin-bottom:8px;background:#fff}
.caja .tabla td{padding:6px 8px}
.caja .tabla td:first-child{font-weight:600;color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.nums div{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.nums .num{font-size:1.25rem;font-weight:700;color:var(--brand)}
.nums span:last-child{font-size:.8rem;color:var(--ink2)}
.esen-pie{margin-top:18px;padding:16px 18px;background:var(--goodSoft);border:1px solid rgba(5,150,105,.25);border-radius:var(--r-lg);color:var(--goodText)}
.esen-pie p{margin:0 0 8px;font-size:.9rem}
.esen-pie .subtle{color:#3f6f5b}

.sec{margin-top:26px}
.sec>h2{font-size:1rem;font-weight:600;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
form#form-ej{border:1px solid var(--line)!important;background:var(--surface)!important;border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:18px!important}
form#form-ej label{font-size:.8rem;font-weight:600;color:var(--ink2);display:grid;gap:6px}

@media (max-width:560px){
  .wrap{padding-inline:16px}
  .fila-b{grid-template-columns:44px 1fr;row-gap:6px;padding-inline:14px}
  .medidor{grid-column:1/-1;justify-content:flex-start}
  .brandrow .subtle{padding-left:0}
  .unidad-h,.panel{padding-inline:14px}
}

{id:"e-porcelanato", tema:"t42", origen:"Ejemplo de clase · 4.2 Material", tipo:"calculo", verif:"clase", fam:"PMPO",
 enunciado:"Obra por contrata en Angamos. Material: porcelanato marmolizado gris 60x60 cm (caja = 1.44 m², 4 unidades, 28.1 kg). Cotizaciones con IGV: Promart S/ 36.90, Sodimac S/ 31.90, Cassinelli S/ 39.90. Transportistas sin IGV: S/ 120, S/ 100 y S/ 105 por tonelada. Calcular el precio unitario del porcelanato puesto en obra (S/ por m²).",
 pasos:[
  "Contrata ⇒ trabajar sin IGV. Precios sin IGV: 31.27, 27.03 y 33.81 S/ porm² de referencia en tienda.",
  "PMO = promedio de las tres cotizaciones sin IGV = 30.71 S/ porm².",
  "Flete: promedio de transportistas = 108.33 S/ porton = 0.10833 S/ porkg.",
  "Peso por m²: 28.1 kg por caja ÷ 1.44 m² por caja = 19.51 kg/m².",
  "F = 0.10833 S/ porkg × 19.51 kg/m² = 2.11 S/ porm².",
  "A/M = 2% × PMO = 0.61 S/ porm². m (mermas) = 5% × PMO = 1.54 S/ porm². V = 0, O = 0.",
  "PMPO = 30.71 + 2.11 + 0.61 + 1.54 = 34.97 S/ porm²."],
 resp:"PMPO = 34.97 S/ por m²"},

{id:"e-ladrillo-clase", tema:"t42", origen:"Ejemplo de clase · 4.2 Material", tipo:"calculo", verif:"clase", fam:"PMPO",
 enunciado:"Determinar el precio unitario del ladrillo por unidad para el ET. Obra por contrata; el ET se entrega el 11 de setiembre de 2026. Se requieren 30 000 unidades. Sodimac-Piura cotizó al 13 de agosto a S/ 0.90 con IGV, con 10% de descuento por compras mayores a 10 000 und. Otros proveedores cotizaron el 28 de agosto a S/ 1.05 y S/ 0.95 con IGV. El 7 de setiembre el precio bajó a S/ 0.80 en todos los proveedores.",
 pasos:[
  "Mes base = agosto, por la fecha de entrega del ET (11 de setiembre).",
  "El precio del 7 de setiembre es posterior al mes base ⇒ no se considera.",
  "Los descuentos no se incluyen en el PMO.",
  "Contrata ⇒ sin IGV: 0.76, 0.89 y 0.81 S/ porund.",
  "PMO = promedio = 0.82 S/ porund.",
  "En la versión desarrollada en clase el flete y los demás términos quedaron en 0.",
  "PMPO = 0.82 S/ porund."],
 resp:"PMPO = 0.82 S/ por unidad",
 nota:"En la hoja de clase (10/09/26) el flete quedó pendiente: la ingeniera dijo que lo terminaría en la siguiente clase con el flete en dos tramos (tienda → caserío por millar, y caserío → obra con el camión de S/ 250 por día y 5 viajes de un millar). La dinámica, en sus palabras, es exactamente igual a la del porcelanato. Así lo resolvió en video: clase 8, 1:32:23 y 1:34:09."},

{id:"e-cemento", tema:"t42", origen:"4.2 Material_Ejercicios · Ejercicio 1", tipo:"calculo", verif:"propuesta", fam:"PMPO",
 enunciado:"Se requiere presupuestar 450 bolsas de Cemento Portland Tipo MS para una obra de saneamiento en Canchaque. El ET se entrega el 25 de julio de 2026. Obra por contrata. Cotizaciones de junio con IGV: proveedor A S/ 29.50, B S/ 30.20, C S/ 31.00. Descuentos por compras mayores a 400 bolsas: A 5%, B 8%, C 10%. El 5 de julio el precio regional subió 6% sobre el precio base. Flete Piura–Canchaque: S/ 4.50 por bolsa con IGV. De Canchaque a la obra se usa camioneta 4x4 a S/ 550 por día sin IGV, 8 viajes diarios de 25 bolsas.",
 pasos:[
  "Mes base = junio, por la fecha de entrega del ET (25 de julio). El alza del 5 de julio es posterior ⇒ no se considera.",
  "Los descuentos no entran en el PMO.",
  "Contrata ⇒ sin IGV: 29.50/1.18 = 25.0000; 30.20/1.18 = 25.5932; 31.00/1.18 = 26.2712.",
  "PMO = promedio = 25.62 S/ porbolsa.",
  "Flete tramo 1 (Piura–Canchaque): 4.50/1.18 = 3.81 S/ porbolsa.",
  "Flete tramo 2 (Canchaque–obra): 8 viajes × 25 bolsas = 200 bolsas/día ⇒ 550/200 = 2.75 S/ porbolsa.",
  "F = 3.81 + 2.75 = 6.56 S/ porbolsa.",
  "A/M = 2% × 25.62 = 0.51. m = 5% × 25.62 = 1.28.",
  "PMPO = 25.62 + 6.56 + 0.51 + 1.28 = 33.98 S/ porbolsa."],
 resp:"PMPO ≈ 33.98 S/ por bolsa",
 nota:"Solución propuesta, no corregida por la ingeniera. El criterio del mes base sí está confirmado: en la clase 8 (1:28:52) preguntó cuál era el mes para un ET del 11 de setiembre y validó 'agosto, porque el presupuesto se elabora antes'. Por eso aquí el mes base es junio y el alza del 5 de julio no entra."},

{id:"e-ladrillo-bernal", tema:"t42", origen:"4.2 Material_Ejercicios · Ejercicio 5", tipo:"calculo", verif:"propuesta", fam:"PMPO",
 enunciado:"Vivienda social en Bernal: 12 500 unidades de ladrillo King Kong 18 huecos. ET se entrega el 14 de mayo de 2026. Obra por contrata. Cotizaciones de abril sin IGV: ladrillera 1 S/ 0.85, ladrillera 2 S/ 0.90, ladrillera 3 S/ 0.82. Descuentos por más de 10 millares: L1 12%, L3 5%. El 10 de mayo subió el precio y llegaron cotizaciones de A S/ 0.90, B S/ 1.05 y C S/ 0.87. Flete Castilla–Bernal: un tráiler a S/ 480 por millar con IGV; otras dos cotizaciones a S/ 400 y S/ 390 por millar sin IGV. De Bernal a la obra se usa motofurgón a S/ 35 por viaje con IGV, capacidad 400 ladrillos.",
 pasos:[
  "Mes base = abril, por la fecha de entrega del ET (14 de mayo). Las cotizaciones del 10 de mayo son posteriores ⇒ no se consideran.",
  "Los descuentos no entran en el PMO. Las cotizaciones de abril ya están sin IGV.",
  "PMO = (0.85 + 0.90 + 0.82)/3 = 0.8567 S/ porund.",
  "Flete tramo 1: 480/1.18 = 406.78; promedio con 400 y 390 = 398.93 S/ pormillar ⇒ 0.3989 S/ porund.",
  "Flete tramo 2: 35/1.18 = 29.66 por viaje ÷ 400 ladrillos = 0.0742 S/ porund.",
  "F = 0.3989 + 0.0742 = 0.4731 S/ porund.",
  "A/M = 2% × 0.8567 = 0.0171. m = 5% × 0.8567 = 0.0428.",
  "PMPO = 0.8567 + 0.4731 + 0.0171 + 0.0428 = 1.3897 S/ porund."],
 resp:"PMPO ≈ 1.39 S/ por unidad",
 nota:"Solución propuesta, no corregida. Ojo: aquí las cotizaciones de abril vienen sin IGV, a diferencia de los otros ejercicios."},

{id:"e-varilla", tema:"t42", origen:"4.2 Material_Ejercicios · Ejercicio 6", tipo:"calculo", verif:"propuesta", fam:"PMPO",
 enunciado:"Puente en Malingas (Tambogrande): trasladar 350 varillas de acero de 5/8\". Obra por contrata. Distribuidores con IGV: 1) S/ 68, 2) S/ 71, 3) S/ 69.50. De Sullana a Tambogrande, camiones cobran por el lote total S/ 1 200, S/ 1 500 y S/ 1 350, todos con IGV. De Tambogrande a la obra se usa carreta a S/ 180 por día sin IGV, 4 viajes diarios con capacidad de 1 500 kg. Cada varilla de 5/8\" pesa 14.8 kg.",
 pasos:[
  "Contrata ⇒ sin IGV: 68/1.18 = 57.63; 71/1.18 = 60.17; 69.50/1.18 = 58.90.",
  "PMO = promedio = 58.90 S/ porvarilla.",
  "Flete tramo 1: sin IGV los lotes son 1 016.95, 1 271.19 y 1 144.07 ⇒ promedio 1 144.07 S/ por el lote de 350 varillas = 3.27 S/ porvarilla.",
  "Flete tramo 2: 4 viajes × 1 500 kg = 6 000 kg/día ÷ 14.8 kg = 405.4 varillas/día ⇒ 180/405.4 = 0.44 S/ porvarilla.",
  "F = 3.27 + 0.44 = 3.71 S/ porvarilla.",
  "A/M = 2% × 58.90 = 1.18. m = 5% × 58.90 = 2.94.",
  "PMPO = 58.90 + 3.71 + 1.18 + 2.94 = 66.73 S/ porvarilla."],
 resp:"PMPO ≈ 66.73 S/ por varilla",
 nota:"Solución propuesta, no corregida. Aquí el flete del tramo 1 viene por lote completo: hay que repartirlo entre las 350 varillas."},

{id:"e-ladrillo-techo", tema:"t42", origen:"Práctica pasada · 2017 · Pregunta 5", tipo:"examen", verif:"propuesta", fam:"PMPO",
 enunciado:"Determine el costo por unidad del ladrillo de techo de 0.30 × 0.30 × 0.15 puesto en obra, así como el aporte unitario por metro cuadrado de una losa aligerada (5.50 ptos). Vigueta de 10 cm. El presupuesto se elabora el 19 de mayo de 2017, obra por contrata. Desperdicio del ladrillo: 5%. Promart Piura cotizó al 30.04.17 en S/ 1.90 la unidad (sin IGV), con 20% de descuento por más de 3 000 unidades; el metrado total de la obra es 1 000 m². El 10.05.17 hubo un aumento y el ladrillo está a S/ 2.00 (sin IGV). La obra está en Querecotillo, cerca de Sullana. Flete Promart–Querecotillo: transportista 1 S/ 90 por millar, transportista 2 S/ 80 por millar. El único acceso a la obra es un puente por el que solo pasa un burro: alquiler S/ 50 por día (sin IGV), 5 viajes diarios, 100 unidades por viaje.",
 pasos:[
  "Mes base = abril, por la fecha del presupuesto (19 de mayo). La cotización válida es la del 30.04.17: S/ 1.90. El alza del 10.05 es posterior ⇒ no se considera.",
  "El descuento del 20% no entra en el PMO, aunque la obra necesite 8 750 ladrillos y supere los 3 000. Ese dato es un distractor.",
  "La cotización ya está sin IGV, como corresponde a obra por contrata. PMO = 1.90 S/ por unidad.",
  "Flete tramo 1 (Promart–Querecotillo): promedio (90 + 80)/2 = 85 S/ por millar = 0.085 S/ por unidad.",
  "Flete tramo 2 (el burro): 50 S/ por día ÷ (5 viajes × 100 unidades) = 0.10 S/ por unidad.",
  "F = 0.085 + 0.10 = 0.185 S/ por unidad.",
  "A/M = 2% × 1.90 = 0.038. m = 5% × 1.90 = 0.095.",
  "PMPO = 1.90 + 0.185 + 0.038 + 0.095 = 2.218 ≈ 2.22 S/ por unidad.",
  "Aporte unitario: cada ladrillo de 30 cm más la vigueta de 10 cm forman un módulo de 0.40 × 0.30 = 0.12 m² ⇒ 1/0.12 = 8.33 ladrillos por m².",
  "Con 5% de desperdicio: 8.33 × 1.05 = 8.75 unidades por m² de losa.",
  "Costo del ladrillo por m² de losa = 8.75 × 2.218 ≈ 19.41 S/ por m²."],
 resp:"PMPO ≈ 2.22 S/ por unidad · Aporte unitario ≈ 8.75 und/m² · ≈ 19.41 S/ por m² de losa",
 nota:"Solución propuesta con el criterio de mes base que la ingeniera confirmó en clase. Dos trampas: el descuento y el alza posterior. Y un matiz: el desperdicio del 5% va en el aporte unitario (colocación); la merma del 5% del PMPO es por transporte y son conceptos distintos, por eso ambos se aplican."},

{id:"e-tractor", tema:"t44", origen:"Ejemplo de clase · 4.3 Equipo", tipo:"calculo", verif:"clase", fam:"Hora máquina",
 enunciado:"Tractor con valor de adquisición de $ 100 000. Trabaja 5 años y luego se vende en $ 25 000. ¿Cuál es su depreciación por hora?",
 pasos:[
  "Vida económica en horas = 5 años × 10 meses × 25 días × 8 horas = 10 000 h.",
  "D = (VA − VR) / VE(horas) = (100 000 − 25 000) / 10 000.",
  "D = 7.50 $/hora."],
 resp:"D = 7.50 $ por hora"},

{id:"e-cargador-cp", tema:"t44", origen:"Ejemplo de clase · 4.3 Equipo", tipo:"calculo", verif:"clase", fam:"Hora máquina",
 enunciado:"Cargador sobre llantas con valor de adquisición de S/ 600 000. Trabaja 5 años y se vende al 20% del VA. Tasa de interés 10%. ¿Cuál es el costo de posesión por hora?",
 pasos:[
  "VE(horas) = 5 × 10 × 25 × 8 = 10 000 h. VR = 20% × 600 000 = 120 000.",
  "D = (600 000 − 120 000) / 10 000 = 48.00 S/ porh.",
  "K = ((n+1)·n / 2n) / VE(horas) = ((6 × 5) / 10) / 10 000 = 3 / 10 000 = 0.0003.",
  "I = VA × tasa × K = 600 000 × 0.10 × 0.0003 = 18.00 S/ porh.",
  "S, I y A = 5% × VA × K = 0.05 × 600 000 × 0.0003 = 9.00 S/ porh.",
  "CP = D + I + (S, I y A) = 48 + 18 + 9 = 75.00 S/ porh."],
 resp:"CP = 75.00 S/ por hora"},

{id:"e-cargador-co", tema:"t44", origen:"Ejemplo de clase · 4.3 Equipo", tipo:"calculo", verif:"parcial", fam:"Hora máquina",
 enunciado:"Mismo cargador sobre llantas de 140 HP, obra por contrata. VA S/ 600 000 con IGV, 5 años, se vende al 20% del VA, tasa 10%, %MyR = 70%. Galón de combustible S/ 24 con IGV, galón de aceite S/ 80 con IGV, libra de grasa S/ 20 con IGV. Cuatro neumáticos con VA de S/ 16 000 con IGV y VE de 2 000 h. Costo HH del operario S/ 28.95. ¿Cuál es el costo de operación?",
 pasos:[
  "Contrata ⇒ pasar todo a valores sin IGV antes de operar.",
  "MyR = %MyR × VA / VE(horas), con VE = 10 000 h.",
  "C (combustible) = consumo en gal/h × precio del galón. El consumo sale de la tabla por tipo y potencia de máquina que la ingeniera entrega en clase.",
  "L (lubricantes) y F (filtros): se estiman como 20% del costo de combustibles más lubricantes.",
  "N = VA del neumático / VE del neumático = (16 000 sin IGV) / 2 000 h.",
  "O (operador): el cargador frontal es equipo pesado ⇒ 1.5 × 28.95 = 43.43 S/ porh.",
  "CO = MyR + C + L + F + N + O."],
 nota:"No se puede cerrar el número sin la tabla de consumo de combustible por potencia. Pídele esa tabla a la ingeniera o búscala en el material de Ramos Salazar."},

{id:"e-taller1", tema:"t25", origen:"Taller 1-1 · Radiografía de obra pública", tipo:"taller", verif:"clase", fam:"Contratación",
 enunciado:"Objetivo de la ingeniera: extraer información situacional y legal de obras públicas peruanas a través del SEACE, el Sistema de Seguimiento de Inversiones (SSI de Invierte.pe) y PLADICOP. Completar la ficha técnica contractual y situacional de una obra pública real: entidad contratante, tipo de procedimiento de selección, valor referencial, sistema de entrega, contratista, plazo contractual, monto contractual, modalidad de pago, mecanismo de garantía y estado actual.",
 pasos:[
  "Fuentes indicadas: SEACE (Sistema Electrónico de Contrataciones del Estado), SSI (Sistema de Seguimiento de Inversiones) y el buscador público de contratos.",
  "Partir del CUI del proyecto para enlazar inversión y contrato.",
  "Los estados posibles: en licitación, en ejecución, paralizado o en arbitraje, en recepción, en liquidación, finalizado, en operación.",
  "Cuidar la coherencia: el sistema de entrega condiciona la modalidad de pago y esta condiciona quién asume cada riesgo."],
 nota:"Ejemplo resuelto en clase: mejoramiento de vía urbana, Municipalidad Provincial de Piura, adjudicación simplificada, valor referencial S/ 8 737 859.46, DBB solo construcción, Consorcio GDC, 150 días, S/ 8 718 636.16, suma alzada, carta fianza de fiel cumplimiento, en liquidación."},

{id:"e-taller2", tema:"t25", origen:"Taller 1-2 · Distribución de riesgos contractuales", tipo:"taller", verif:"clase", fam:"Contratación",
 enunciado:"Objetivo de la ingeniera: analizar cómo varía la asignación de riesgos entre la Entidad y el Contratista según el sistema de entrega (DBB vs. DB) y la modalidad de pago (suma alzada vs. precios unitarios) frente a incidencias reales. Dado el proyecto de mejoramiento y ampliación de una vía urbana (DBB, solo construcción, suma alzada, 150 días), determinar para cada situación quién soporta principalmente el riesgo y por qué.",
 pasos:[
  "Identificar la situación y a qué categoría de riesgo pertenece.",
  "Preguntar quién controla mejor ese riesgo y qué dice el contrato.",
  "Justificar siempre desde las características de contratación: sistema de entrega y modalidad de pago.",
  "En suma alzada el contratista asume la variación de metrados; en precios unitarios la asume la entidad."],
 nota:"Corrección de la ingeniera en este taller: a casi todos los grupos les faltó destacar las características de contratación que influyen en esa distribución de riesgos. Ese es el punto que califica."},

{id:"e-taller3", tema:"t23", origen:"Taller 1-3 · Stakeholder incómodo", tipo:"taller", verif:"clase", fam:"Stakeholders",
 enunciado:"Objetivo de la ingeniera: mapear la postura, poder, influencia, impacto e interés de la sociedad civil y estructurar un plan de mitigación frente a un conflicto social en ejecución física. Analizar a la junta vecinal y comerciantes como interesados: posición actual y deseada (en contra, neutro, de apoyo), interés, poder, influencia e impacto, expectativa de valor y estrategia de involucramiento.",
 pasos:[
  "Caracterizar al interesado antes de puntuarlo.",
  "Redactar la expectativa de valor desde la óptica del interesado, con precisión, no en términos genéricos.",
  "Puntuar los cuatro atributos sin confundirlos entre sí.",
  "Aterrizar las estrategias de involucramiento a la situación descrita, no en general."],
 nota:"Corrección de la ingeniera: la caracterización suele estar bien, pero falta precisión en la expectativa de valor y las estrategias se responden de forma global en lugar de aterrizarlas a la situación del enunciado."},

{id:"e-entrega", tema:"t25", origen:"Conceptual · Elegir el sistema de entrega", tipo:"conceptual", verif:"clase", fam:"Contratación",
 enunciado:"¿Qué sistema de entrega corresponde a cada situación y por qué? a) Un proyecto de baja complejidad con diseño terminado. b) Un proyecto donde el constructor puede aportar valor al diseño. c) Un proyecto de muy alta complejidad con múltiples especialidades.",
 pasos:[
  "a) DBB (Diseño – Licitación – Construcción), o solo construcción: proyectos de baja complejidad, el diseño ya está cerrado.",
  "b) DB (Diseño – Construcción): el constructor aporta valor al diseño.",
  "c) IPD (Entrega integrada de proyectos) o CM: proyectos de muy alta complejidad. CM-agente y CM-at-Risk corresponden a alta complejidad.",
  "El criterio general: madurez de la información del proyecto, complejidad o envergadura, nivel de participación del contratista en el diseño y asignación de riesgos."],
 resp:"a) DBB · b) DB · c) IPD (o CM según el grado)"},

{id:"e-pago", tema:"t25", origen:"Conceptual · Suma alzada vs. precio unitario", tipo:"conceptual", verif:"clase", fam:"Contratación",
 enunciado:"Explicar la diferencia entre suma alzada y precio unitario, y decir cuándo conviene cada modalidad de pago.",
 pasos:[
  "Suma alzada: precio único para todo el proyecto. Exige que el contratista tenga planos y especificaciones completos. Las modificaciones requieren órdenes de cambio.",
  "Precio unitario: se paga por unidad de trabajo según cantidades reales. Conviene cuando se conoce la naturaleza del trabajo y las cantidades solo de forma aproximada.",
  "Consecuencia en riesgo: en suma alzada el riesgo de metrados lo asume el contratista; en precio unitario lo asume la entidad.",
  "Existen además el esquema mixto y el costo reembolsable."],
 resp:"Suma alzada: precio cerrado, diseño completo, riesgo de metrados al contratista. Precio unitario: pago por cantidades reales, riesgo de metrados a la entidad."},

{id:"e-alcance", tema:"t33", origen:"Conceptual · Del PMI al expediente técnico", tipo:"conceptual", verif:"clase", fam:"Alcance",
 enunciado:"Traducir cada concepto del PMI a su documento equivalente en un proyecto constructivo peruano: recopilar requisitos, declaración del alcance, EDT y diccionario de la EDT. Luego, clasificar las variaciones del alcance en obra pública.",
 pasos:[
  "Recopilar requisitos → revisión de consultas y observaciones al expediente técnico.",
  "Declaración del alcance → memoria descriptiva y especificaciones técnicas.",
  "EDT → itemizado de partidas.",
  "Diccionario de la EDT → especificaciones técnicas y Análisis de Precios Unitarios (APU).",
  "Variaciones: mayores o menores metrados (más o menos metrado en una partida existente); obra adicional (trabajo que no existe en el contrato, requiere expediente técnico adicional y resolución de aprobación previa); deductivo vinculante (el trabajo que se deja de hacer por el adicional)."],
 resp:"El Expediente Técnico es la línea base del alcance."},

{id:"e-edt", tema:"t32", origen:"Conceptual · Principios de la EDT", tipo:"conceptual", verif:"clase", fam:"Alcance",
 enunciado:"Enunciar los cuatro principios básicos de la EDT y explicar la regla del 100%.",
 pasos:[
  "Regla del 100%: la suma de los niveles inferiores debe cubrir exactamente todo el alcance del nivel superior, ni más ni menos.",
  "Elementos mutuamente exclusivos: ningún trabajo aparece en dos ramas, para no duplicarlo entre contratistas o subcontratistas.",
  "Orientada a entregables, no a acciones.",
  "Base para el costo y el tiempo: sobre los paquetes de trabajo se estiman recursos, duraciones y costos."],
 resp:"Regla del 100%, mutuamente exclusivos, orientada a entregables, base para costo y tiempo."},

{id:"x-casitos", tema:"t32", origen:"Anunciado para la PC1 · casos cortos de alcance", tipo:"conceptual", verif:"clase", fam:"Alcance",
 enunciado:"Para el proyecto de mejoramiento de pistas y veredas de una zona urbana, clasifica cada enunciado como alcance del PRODUCTO (característica de lo que se entrega) o alcance del PROYECTO (trabajo necesario para entregarlo): a) Pavimento flexible con vida útil mínima de 20 años. b) Realizar el estudio de tráfico (IMD) y el diseño de mezcla asfáltica bajo AASHTO. c) Rampas peatonales en todas las esquinas con señalización podotáctil. d) Reubicar los postes de alumbrado que interfieren con el nuevo trazo. e) Ensayos de densidad de campo con cono de arena por cada capa compactada. f) Base granular compactada al 100% de la máxima densidad seca. g) Gestionar el plan de desvío de tránsito con vigías, conos y barreras New Jersey. h) Obtener el acto de conformidad de la empresa de electricidad.",
 pasos:[
  "Pregunta guía: ¿esto describe cómo ES la obra terminada, o algo que hay que HACER para llegar a ella?",
  "a) Producto: es una característica del pavimento.",
  "b) Proyecto: es trabajo de diseño para llegar al producto.",
  "c) Producto: describe el entregable físico.",
  "d) Proyecto: es una tarea de ejecución, aunque termine dejando un poste en otro sitio.",
  "e) Proyecto: es control de calidad, trabajo del equipo.",
  "f) Producto: es la especificación que debe cumplir la base.",
  "g) Proyecto: gestión de tránsito durante la obra; no queda en el producto final.",
  "h) Proyecto: gestión con un interesado; en clase la ingeniera puso justo este ejemplo como trabajo que puede quedar fuera de la jurisdicción de la empresa pero sigue siendo parte del proyecto.",
  "Regla que suele salvar los casos dudosos: si desaparece cuando la obra se entrega, es del proyecto; si el usuario lo toca, lo pisa o lo ve, es del producto."],
 resp:"Producto: a, c, f. Proyecto: b, d, e, g, h.",
 nota:"La ingeniera anunció el 10-set que en la PC1 habría 'pequeños casitos' para identificar producto y proyecto. Los enunciados salen de la tabla de requisitos de la diapositiva 3.2 y del ejemplo que puso en la clase 6 (1:17:51)."},

{id:"x-pc1-24-red", tema:"t52", origen:"Práctica 1 · 2024-II · 6-set-2024", tipo:"examen", verif:"examen", fam:"Programación",
 enunciado:"Programación de un edificio de concreto prefabricado. Se dan 13 actividades (A a M) con metrado y rendimiento; los vínculos se describen en prosa. Se pide: tabla de precedencias con sucesoras y duraciones (4.5 ptos), diagrama de red (6 ptos), fechas del proyecto (5 ptos), holguras (3 ptos) y ruta crítica (0.5 ptos). Antes hay un verdadero/falso sobre predecesoras y sucesoras (1 pto).",
 pasos:[
  "Duración = metrado ÷ rendimiento, redondeando hacia arriba a días enteros. Las actividades sin metrado traen la duración dada.",
  "Traducir cada frase de vínculos a una relación: 'no puede iniciar hasta que esté terminado' es fin-comienzo; 'se realizan en paralelo' significa que comparten predecesoras, no que se vinculen entre sí.",
  "Con la red hecha, recorrido hacia adelante para FPI y FPF; hacia atrás para FUI y FUF.",
  "Holgura total = FUF − FPF (o FUI − FPI). Holgura libre = menor FPI de las sucesoras − FPF.",
  "La ruta crítica es la cadena de actividades con holgura total cero."],
 nota:"En el examen resuelto la ruta crítica pasa por B-E/F-H-I-J y la duración total sale 36 días. Las duraciones que hay que calcular son D=8, E=10, F=10, K=2, L=1, M=2."},

{id:"x-pc2-24-mo", tema:"t43", origen:"Práctica 2 · 2024-II · 18-oct-2024", tipo:"examen", verif:"examen", fam:"Mano de obra",
 enunciado:"Calcular el costo de la hora-hombre del operario bajo el régimen laboral de construcción civil y usarlo en el ACU de 'Tarrajeo exterior fachada piso 5' acelerado, donde el peón y el operario trabajan 4 horas extras diarias (4 ptos).",
 pasos:[
  "Armar la Tabla 2 con todos los conceptos remunerativos: jornal básico, dominical, BUC, escolaridad, movilidad, horas extras, gratificaciones, bonificaciones, compensación vacacional, indemnización, prestaciones de salud, SCTR, CONAFOVICER y SNP.",
  "Horas extras: sobretasa de 60% para las 2 primeras horas y 100% para las siguientes. Con 4 horas extras, dos van al 60% y dos al 100%.",
  "Costo hh = total del periodo ÷ (horas por día × días del periodo).",
  "Llevar ese costo hh al ACU: Cantidad = cuadrilla ÷ rendimiento diario × 8 horas; Parcial = cantidad × precio.",
  "El costo unitario de la partida es la suma de los parciales de mano de obra, materiales y equipos.",
  "ACU corregido del tarrajeo acelerado (rendimiento 7 m²/día): operario 1.1429 hh × 39.40 = 45.03; peón 0.5714 hh × 22.70 = 12.97; clavos 0.091; arena 2.973; agua 0.051; cemento 5.756; herramientas 3% de MO = 1.74; regla de aluminio 7.70; andamio 0.3333 hm × 16 = 5.33."],
 resp:"Costo unitario acelerado = 81.65 S/ por m² (hh operario con 4 horas extras: 39.40; peón: 22.70)",
 nota:"En el examen resuelto el costo hh del operario en jornada normal sale S/ 28.82/h (691.73 entre 8 horas por 3 días) y con 4 horas extras sube a 39.40. Fíjate que la cantidad de mano de obra se calcula igual (8 h ÷ rendimiento), lo que cambia es el precio de la hora."},

{id:"x-pc2-24-pmpo", tema:"t42", origen:"Práctica 2 · 2024-II · 18-oct-2024", tipo:"examen", verif:"examen", fam:"PMPO",
 enunciado:"Para el ACU del tarrajeo hay que costear cemento y arena. Cemento: Sodimac S/ 27.50 por bolsa con flete S/ 0.11/kg; Promart S/ 30.00 con flete S/ 0.12/kg; Dino S/ 30.50 con flete S/ 0.10/kg (precios con IGV). Arena: Cantera 1 S/ 70/m³ con flete S/ 50/m³; Cantera 2 S/ 68 con flete S/ 55; Cantera 3 S/ 75 con flete S/ 45. Determinar el precio puesto en obra de cada material.",
 pasos:[
  "Obra por contrata ⇒ quitar el IGV a todos los precios cotizados.",
  "PMO = promedio de las tres cotizaciones sin IGV.",
  "El flete del cemento viene por kg: la bolsa es de 42.5 kg, así que hay que llevarlo a soles por bolsa antes de promediar.",
  "El flete de la arena ya viene en la misma unidad del ACU (m³), se promedia directo. Sus cotizaciones no llevan asterisco de IGV: se toman tal cual.",
  "Cemento: PMO = (23.31 + 25.42 + 25.85)/3 = 24.86; F = 0.11 S/ por kg × 42.5 kg = 4.68; A/M = 0.50; m = 1.24 ⇒ 31.28 S/ por bolsa.",
  "Arena: PMO = 71.00; F = 50.00; A/M = 1.42; m = 3.55 ⇒ 125.97 S/ por m³.",
  "Esos dos precios van a la columna 'Precio' del ACU del tarrajeo y se multiplican por la cantidad (0.1840 bol y 0.0236 m³)."],
 resp:"Cemento 31.28 S/ por bolsa · Arena 125.97 S/ por m³ (ambos dados por correctos en el examen)",
 nota:"El detalle que suele costar puntos: el flete cotizado por kg hay que convertirlo a la unidad de medida del ACU, la bolsa de 42.5 kg. En el ACU corregido: cemento 0.1840 × 31.28 = 5.756 y arena 0.0236 × 125.97 = 2.973."},

{id:"x-pc2-24-crash", tema:"t53", origen:"Práctica 2 · 2024-II · 18-oct-2024", tipo:"examen", verif:"examen", fam:"Aceleración",
 enunciado:"Reducir la duración del proyecto en 2 días (4 ptos) y calcular la variación del costo total, incluyendo costos directos e indirectos, sabiendo que los indirectos son S/ 40 por cada día de ejecución (0.5 ptos). La tabla trae por actividad: metrado, rendimiento diario por cuadrilla, número de cuadrillas, duración, costo unitario, costo parcial, máxima reducción posible y costo por día de reducción.",
 pasos:[
  "Identificar la ruta crítica antes de acelerar nada: solo sirve acortar actividades críticas.",
  "Ordenar las actividades críticas por costo por día de reducción, de menor a mayor.",
  "Acortar primero la más barata, hasta su máxima reducción posible, y luego seguir con la siguiente.",
  "Después de cada día recortado, revisar si apareció una ruta crítica nueva: si hay dos rutas críticas hay que acortar una actividad en cada una, o una compartida.",
  "Variación del costo = (suma de los costos por día de reducción aplicados) − (días ahorrados × costo indirecto diario).",
  "Si el ahorro de indirectos supera el sobrecosto directo, acelerar conviene."],
 nota:"Fíjate en el signo: acelerar sube el costo directo y baja el indirecto. La pregunta pide la variación neta."},

{id:"x-pc1-25-pert", tema:"t52", origen:"Práctica 1 · 2025-I · 2-may-2025", tipo:"examen", verif:"examen", fam:"PERT",
 enunciado:"Planificación de la construcción de un grifo. Se pide completar sucesoras (1 pto), trazar la red y estimar la duración esperada (4.5 ptos), calcular fechas y holguras (5 ptos), indicar la ruta crítica (0.5 ptos), la probabilidad de terminar entre 95 y 105 días (1.25 ptos), el plazo para una probabilidad del 95% (0.5 ptos) y comparar una actividad con holgura libre contra otra con holgura independiente (1 pto).",
 pasos:[
  "Duración esperada: Te = (To + 4·Tm + Tp) / 6 para cada actividad.",
  "Varianza: σ² = ((Tp − To) / 6)². Solo se suman las varianzas de las actividades de la ruta crítica.",
  "σ del proyecto = raíz de la suma de varianzas críticas.",
  "Z = (TL − TE) / σ, con TE la duración esperada del proyecto y TL el plazo por evaluar.",
  "Para un intervalo, P(95 < T < 105) = P(Z₁₀₅) − P(Z₉₅).",
  "Para el camino inverso (95% de probabilidad), se busca Z en la tabla y se despeja TL = TE + Z·σ.",
  "Holgura libre = FPF sucesora más temprana − FPF de la actividad. Holgura independiente descuenta además la holgura de las predecesoras."],
 nota:"En el examen resuelto: duración esperada 100 días, σ² acumulada 30.08, σ = 5.48, Z(95) = −0.912. Corrección de la profesora: hay que sustentar las holguras con un ejemplo numérico, no solo escribir la fórmula."},

{id:"x-pc2-25-prog", tema:"t52", origen:"Práctica 2 · 2025-II · 7-nov-2025", tipo:"examen", verif:"examen", fam:"Curvas y recursos",
 enunciado:"Programación de un proyecto con 10 actividades, dadas predecesoras, cantidad de trabajo, rendimiento diario por unidad de metrado, operarios y peones por día y costo total. Se pide: tabla de duraciones (0.5 ptos), diagrama de Gantt con fecha de fin (2.5 ptos) sabiendo que se inicia el lunes 3 de noviembre de 2025 y se trabaja de lunes a sábado sin feriados, diagrama de red (2.5 ptos), ruta crítica y duración (1 pto), histograma diario del recurso peón (2 ptos) y curva S asumiendo costo por día proporcional (2.5 ptos).",
 pasos:[
  "Duración = cantidad de trabajo ÷ rendimiento diario, redondeada hacia arriba.",
  "Para el Gantt con calendario: contar solo días laborables (lunes a sábado). Un proyecto de N días laborables no termina N días después en el calendario.",
  "El histograma de peón se arma sumando, día por día, los peones de todas las actividades activas ese día. Los picos indican dónde hay que nivelar recursos.",
  "Curva S: costo diario de cada actividad = costo total ÷ duración; se reparte por día, se suma por día y se acumula.",
  "La curva S se traza sobre el calendario, no sobre los días laborables numerados."],
 nota:"Esta pregunta junta todo lo de programación: es la más rentable para practicar completa."},

{id:"x-pc2-25-pert", tema:"t52", origen:"Práctica 2 · 2025-II · 7-nov-2025", tipo:"examen", verif:"examen", fam:"PERT",
 enunciado:"Vivienda social con 9 actividades y tiempos optimista, probable y pesimista. Se pide: red (2.5 ptos), fechas FPI, FUI, FPF y FUF (1.5 ptos), ruta crítica y duración (1 pto), probabilidad de terminar antes de 45 días (2 ptos) y qué duración pondrías si el cliente pide una probabilidad de éxito de al menos 93% (2 ptos). Trabajar con 2 decimales.",
 pasos:[
  "Te = (To + 4·Tm + Tp)/6 y σ² = ((Tp − To)/6)² para cada actividad.",
  "Ojo con los vínculos especiales del enunciado: A FC-1, C FC+5, E FC-3, F FC-1, H FC+2 desplazan las fechas.",
  "Red, recorrido adelante y atrás, ruta crítica con holgura cero.",
  "P(T < 45): Z = (45 − TE)/σ y se lee la tabla normal.",
  "Para 93%: se busca el Z que deja 0.93 a la izquierda (≈ 1.48) y se calcula TL = TE + 1.48·σ."],
 nota:"Las dos preguntas de probabilidad valen 4 de los 20 puntos y son las que más se dejan en blanco por falta de tiempo."},

{id:"x-pc3-25-poli", tema:"t45", origen:"Práctica 3 · 2025-I · 13-jun-2025", tipo:"examen", verif:"examen", fam:"Fórmula polinómica",
 enunciado:"Elaborar la fórmula polinómica de un proyecto a partir del listado de recursos con su monto en soles y su índice unificado (IU). Costos directos S/ 800 000, gastos generales 12% del costo directo (IU 39), utilidad 8% del costo directo (IU 39). Se debe incluir un monomio compuesto (8 ptos).",
 pasos:[
  "Calcular el monto total del presupuesto: CD + GG + U.",
  "Coeficiente de incidencia de cada recurso = monto del recurso ÷ monto total. La suma de todos debe dar 1.000.",
  "Agrupar recursos por índice unificado; los que comparten IU se suman en un solo término.",
  "La fórmula admite como máximo 8 monomios y cada coeficiente de incidencia no puede ser menor a 0.050.",
  "Los recursos con incidencia menor a 0.050 se agrupan con otros afines formando un monomio compuesto, cuyo índice es un promedio ponderado de los IU agrupados.",
  "Escribir K = a·(Jr/Jo) + b·(Mr/Mo) + ... con los coeficientes redondeados a 3 decimales y sumando exactamente 1."],
 nota:"Vale 8 de 20 puntos, la pregunta más cara de todas las prácticas revisadas. Los recursos de la tabla son mano de obra (IU 47), acero (3), cemento (21), agregado fino (4), agregado grueso (5), ladrillo (17), madera (43), PVC (72), cable (7), aparatos sanitarios (10), pintura (54), maquinaria (48), combustible (53), herramientas (37) y fletes (32)."},

{id:"x-pc3-25-riesgo", tema:"t72", origen:"Práctica 3 · 2025-I · 13-jun-2025", tipo:"examen", verif:"examen", fam:"Riesgos",
 enunciado:"Proyecto de construcción del puente vehicular sobre la Quebrada Seca, zona rural de Piura. Seis riesgos identificados con su probabilidad de ocurrencia e impacto: R1 retraso de materiales (0.8 / 75%), R2 fallas del equipo de topografía (0.6 / 20%), R3 huelga local de transportistas (0.9 / 60%), R4 restos arqueológicos (0.4 / 80%), R5 lluvias torrenciales atípicas (0.7 / 90%), R6 variación del tipo de cambio (0.3 / 30%). Escalas: probabilidad baja <30%, media 30-60%, alta >60%; impacto bajo <35%, medio 35-50%, alto >50%. Ubicar los riesgos en la matriz, hacer el ranking y elegir los dos de mayor prioridad, sustentando (2 ptos).",
 pasos:[
  "Clasificar cada riesgo con las escalas dadas, sin inventar cortes propios.",
  "Probabilidad alta (>60%): R1 (0.8), R3 (0.9), R5 (0.7). Media (30-60%): R2 (0.6), R4 (0.4), R6 (0.3 queda en el límite bajo).",
  "Impacto alto (>50%): R1 (75%), R3 (60%), R4 (80%), R5 (90%). Medio: ninguno claro. Bajo (<35%): R2 (20%), R6 (30%).",
  "Ranking por el producto probabilidad × impacto: R5 = 0.63, R1 = 0.60, R3 = 0.54, R4 = 0.32, R2 = 0.12, R6 = 0.09.",
  "Los dos prioritarios son R5 (lluvias torrenciales) y R1 (retraso de materiales), ambos en la celda alta-alta.",
  "Sustentar con el contexto: en Piura las lluvias atípicas son el riesgo climático dominante y una zona rural agrava la logística de materiales."],
 resp:"Prioritarios: R5 (0.63) y R1 (0.60), ambos probabilidad alta e impacto alto."},

{id:"x-pc3-25-ev", tema:"t62", origen:"Práctica 3 · 2025-I · 13-jun-2025", tipo:"examen", verif:"examen", fam:"Valor ganado",
 enunciado:"Proyecto adjudicado por S/ 2 900 000 con plazo de 8 meses. Al término del mes 4 el avance físico real reportado fue del 45% del trabajo total y se habían gastado S/ 1 400 000. Según la línea base, al término del cuarto mes se debería haber completado el 50%. Se pide: identificar el estado respecto al cronograma y al costo (3 ptos), analizar la eficiencia (1 pto) y proyectar costo, tiempo y lo que resta pagar manteniendo el mismo ritmo (1.5 ptos).",
 pasos:[
  "EV (valor ganado) = 45% × 2 900 000 = S/ 1 305 000.",
  "PV (valor planificado) = 50% × 2 900 000 = S/ 1 450 000.",
  "AC (costo real) = S/ 1 400 000.",
  "SV = EV − PV = −145 000 ⇒ atrasado. CV = EV − AC = −95 000 ⇒ sobrecosto.",
  "SPI = EV/PV = 0.90 y CPI = EV/AC = 0.932: por cada sol gastado se produce 0.93 de valor.",
  "EAC = BAC / CPI = 2 900 000 / 0.932 ≈ S/ 3 111 600. ETC = EAC − AC ≈ S/ 1 711 600 por pagar.",
  "Plazo proyectado = 8 / SPI ≈ 8.9 meses."],
 resp:"Atrasado y sobrecosteado: SV = −145 000, CV = −95 000, SPI = 0.90, CPI = 0.93, EAC ≈ S/ 3.11 millones."},

{id:"x-pc3-25-curva", tema:"t63", origen:"Práctica 3 · 2025-I · 13-jun-2025", tipo:"examen", verif:"examen", fam:"Curvas y recursos",
 enunciado:"Una gráfica muestra el reporte de un proyecto del mes 4 al 9 con tres series: línea base, valorización acumulada y valor ganado acumulado. Se pide, sin cálculos: la duración y el costo total previsto (0.5 ptos), cómo estuvo el proyecto en términos de costo en el mes 4 (0.75 ptos) y en términos de tiempo en el mes 7 (0.75 ptos).",
 pasos:[
  "Duración prevista: el último mes en que la línea base tiene dato. Costo total previsto: su valor final.",
  "Para leer costo: comparar valor ganado contra valorización acumulada (lo que se gastó o cobró). Si el valor ganado está por debajo, hubo sobrecosto.",
  "Para leer tiempo: comparar valor ganado contra línea base. Si el valor ganado va por debajo de la línea base, hay atraso.",
  "No confundir las series: la valorización acumulada es dinero facturado, no avance físico."],
 nota:"En el examen revisado el alumno respondió lo de costo usando el criterio de tiempo y viceversa, y la profesora se lo marcó. Es el error clásico de esta pregunta."},

{id:"x-pc3-25-calidad", tema:"t72", origen:"Práctica 3 · 2025-I · 13-jun-2025", tipo:"examen", verif:"examen", fam:"Calidad",
 enunciado:"Ampliación de un hospital con área de quirófanos y laboratorio de patología. Se dan extractos de las especificaciones técnicas de pisos de quirófanos (vinilo homogéneo antibacteriano, espesor mínimo 2 mm, planicidad ±2 mm en 2 metros), paredes (paneles HPL de 6 mm, verticalidad ±3 mm en 3 metros) y pintura (epóxica sanitaria lavable, dos manos, acabado liso sin porosidades). Seleccionar uno de los tres elementos y definir sus métricas de calidad (3 ptos).",
 pasos:[
  "Una métrica de calidad tiene que ser medible y verificable en obra: valor objetivo, tolerancia y método de verificación.",
  "Pisos: espesor ≥ 2 mm medido con micrómetro; planicidad ±2 mm verificada con regla de 2 m; uniones termosoldadas sin filtración.",
  "Paredes: espesor de panel ≥ 6 mm; verticalidad ±3 mm en 3 m con plomada o nivel láser; juntas selladas herméticas y esquinas redondeadas.",
  "Pintura: dos manos como mínimo, espesor de película seca, inspección visual de acabado liso sin porosidades.",
  "No basta con copiar la especificación: hay que convertirla en criterio de aceptación con instrumento y frecuencia de ensayo."],
 nota:"En el examen revisado se aceptó como correcta la respuesta que copiaba la tolerancia y el criterio; la fila de pintura quedó en blanco y aun así dieron los 3 puntos."},

{id:"x-ef-25-mo", tema:"t43", origen:"Examen final · 2025-I · 3-jul-2025", tipo:"examen", verif:"examen", fam:"Mano de obra",
 enunciado:"Obra por contrata con la partida 'Excavación manual de zanjas' programada en 10 días hábiles (lunes a sábado, 8 horas diarias) iniciando el lunes 7 de julio. Para terminar 1 día antes se evalúan dos opciones: Opción 1, trabajar 2 horas extras diarias los primeros 4 días; Opción 2, trabajar el domingo 13 de julio. Determinar cuál es más económica, desarrollando el costo de la hora hombre y los ACU (7 ptos). Jornales: operario S/ 86.80 (BUC 32%), oficial S/ 69.10 (30%), peón S/ 61.30 (30%).",
 pasos:[
  "Armar la Tabla 1 con los conceptos remunerativos para cada opción, columna por columna.",
  "Opción 1: aparecen horas extras con sobretasa 60% las 2 primeras horas; no hay feriado ni dominical trabajado.",
  "Opción 2: no hay horas extras, pero el domingo trabajado se paga aparte del dominical de descanso, que igual se devenga.",
  "Conceptos que van en ambas: jornal básico, dominical, BUC, escolaridad (30 RB anuales), movilidad S/ 8.60, gratificaciones (40 RB anuales), compensación vacacional 10% RB, indemnización 15% RB, prestaciones de salud 9% RB, SCTR 5% RB, Essalud + Vida S/ 5.00 mensual, Ley 29351 9% de gratificación, CONAFOVICER 2% y SNP 13%.",
  "Costo hh = total ÷ horas efectivas de cada opción.",
  "Llevar cada costo hh al ACU de excavación manual (rendimiento 4.0000 m³/día, cuadrilla 1 peón, herramientas manuales 3% de la mano de obra) y comparar el costo unitario por m³."],
 resp:"La opción 2 (trabajar el domingo) resulta más económica.",
 nota:"En el examen revisado: opción 1 da S/ 2 129.84 y opción 2 S/ 1 573.01. La profesora observó que no se consideró la productividad del trabajo en domingo ni la profundidad de excavación. Vale 7 de 20 puntos: es la pregunta más cara del final."},

{id:"x-ef-25-hm", tema:"t44", origen:"Examen final · 2025-I · 3-jul-2025", tipo:"examen", verif:"examen", fam:"Hora máquina",
 enunciado:"Estimar el costo hm del vibrador de concreto de 4 HP y 1.25\" para un proyecto de administración directa (1 pto). Galón de combustible S/ 23, galón de aceite S/ 38, libra de grasa S/ 18. VA del vibrador S/ 2 500, tasa de interés 10%, valor después de la vida útil 10% del VA, %MyR 75%, vida útil 5 años. Consumos del vibrador de 4 HP: combustible 0.16 gal/hr, lubricantes 0.002 gal/hr, grasas 0.01 lb/hr.",
 pasos:[
  "Administración directa ⇒ HM = solo costo de operación, y los precios van con IGV.",
  "VE(horas) = 5 × 10 × 25 × 8 = 10 000 h.",
  "MyR = 75% × 2 500 / 10 000 = S/ 0.1875 por hora.",
  "Combustible = 0.16 gal/h × S/ 23 = S/ 3.68 por hora.",
  "Lubricantes = 0.002 gal/h × S/ 38 = S/ 0.076 por hora. Grasa = 0.01 lb/h × S/ 18 = S/ 0.18 por hora.",
  "El vibrador no lleva neumáticos ni operador propio en este caso; si se pidiera operador, sería equipo liviano (1.2 × costo HH del operario).",
  "CO ≈ 0.1875 + 3.68 + 0.076 + 0.18 = S/ 4.12 por hora."],
 resp:"CO ≈ S/ 4.12 por hora (administración directa: HM = CO)",
 nota:"Aquí está la tabla de consumos que faltaba para cerrar los ejercicios de hora máquina: vibrador de 4 HP consume 0.16 gal/hr de combustible, 0.002 gal/hr de lubricante y 0.01 lb/hr de grasa."},

{id:"x-ef-25-crash", tema:"t53", origen:"Examen final · 2025-I · 3-jul-2025", tipo:"examen", verif:"examen", fam:"Aceleración",
 enunciado:"Red de alcantarillado con 12 actividades (trazo, excavación, cama de apoyo, tubería PVC, rellenos, buzones, pruebas hidráulicas, tapas), con tiempos optimista, probable y pesimista, y con duración y costo parcial en condiciones normales y en condición acelerada. Se pide: duraciones y red con ruta crítica (4.5 ptos), probabilidad de terminar antes de 35 días (0.25) y entre 35 y 40 días (0.5), reducir la duración en 3 días (4.25 ptos) y calcular la variación del costo total con indirectos de S/ 400 por día (0.5 ptos).",
 pasos:[
  "Te = (To + 4·Tm + Tp)/6 para cada actividad; con esas duraciones se arma la red.",
  "Costo por día de reducción = (costo acelerado − costo normal) ÷ (duración normal − duración acelerada). Calcularlo solo para las críticas.",
  "Ordenar de menor a mayor costo por día y acortar en ese orden, revisando la ruta crítica después de cada día.",
  "Con 3 días recortados: sobrecosto directo = suma de los costos por día aplicados; ahorro indirecto = 3 × S/ 400 = S/ 1 200.",
  "Variación total = sobrecosto directo − ahorro indirecto."],
 nota:"En el examen resuelto el costo normal total es S/ 196 000 y el acelerado total S/ 229 050. Los costos por día más baratos salen en las actividades I (S/ 1 125), L (S/ 775) y H (S/ 4 000): conviene ordenarlos antes de decidir."},

{id:"x-ef-25-lineal", tema:"t54", origen:"Examen final · 2025-I · 3-jul-2025", tipo:"examen", verif:"examen", fam:"Obras lineales",
 enunciado:"Líneas de balance de la construcción de una línea de abastecimiento de agua, con cuatro actividades (limpieza del terreno, apertura de zanjas, colocación de tuberías, relleno de zanjas) y cada 500 m como unidad de trabajo, de 0+000 a 2+000. a) ¿Cuál de las actividades tiene menor rendimiento? Justificar (1 pto). b) ¿Qué pasa si la apertura de zanjas, en los últimos 500 m, demora 1 día más de lo previsto? (1 pto).",
 pasos:[
  "En un diagrama tiempo-espacio, la pendiente de la línea es el inverso del rendimiento: mientras más inclinada (más tiempo por tramo), menor rendimiento.",
  "La actividad de menor rendimiento es la que marca el ritmo de todo el tren de trabajo.",
  "Un retraso en un tramo desplaza hacia arriba el resto de esa línea y, si se toca otra línea, arrastra a las actividades siguientes.",
  "Si las líneas se cruzan, hay interferencia: dos cuadrillas ocuparían el mismo tramo al mismo tiempo, lo que no es físicamente posible.",
  "Por eso en obras lineales se busca que las líneas sean paralelas, con un colchón de tiempo entre ellas."],
 nota:"El alumno respondió que la de menor rendimiento es el relleno de zanjas y obtuvo el punto. Lee las pendientes con cuidado antes de responder."},

{id:"x-15-lineal", tema:"t54", origen:"Examen final · 2015-I · 10-jul-2015", tipo:"examen", verif:"examen", fam:"Obras lineales",
 enunciado:"Un diagrama representa la construcción de una unidad de un proyecto repetitivo con 6 actividades (A 1 día, B 2, C 4, D 3, E 1, F 2) y sus horas-hombre por unidad (8, 48, 32, 48, 32, 16). a) Calcular la duración del proyecto si comprende 8 unidades con un ritmo de 1 día y representarlo en la Carta Dentada (2 ptos). b) Representar el perfil de hh por unidad de tiempo y el acumulado del proyecto (2 ptos).",
 pasos:[
  "Duración total = duración de una unidad + (número de unidades − 1) × ritmo.",
  "La Carta Dentada repite el mismo patrón de actividades desplazado una unidad de ritmo cada vez.",
  "El perfil de hh se arma sumando, día a día, las horas-hombre de todas las actividades activas en ese día de todas las unidades.",
  "En el régimen permanente (cuando todas las cuadrillas están trabajando) el consumo diario de hh se estabiliza: ese es el valor que dimensiona la obra.",
  "El acumulado es la integral del perfil y tiene forma de S."],
 nota:"El examen de 2015 pedía además explicar los métodos de programación en proyectos únicos (3 ptos de parte teórica)."},

{id:"x-15-crash", tema:"t53", origen:"Examen final · 2015-I · 10-jul-2015", tipo:"examen", verif:"examen", fam:"Aceleración",
 enunciado:"El plazo establecido para un proyecto es de 18 días. Se da la red en condiciones normales (A 6, B 5, C 6, D 8, E 9, F 8 días) y por actividad el costo normal, la pendiente de costo y la duración de rotura: A S/ 6 000 / −600 / 3; B S/ 4 000 / −800 / 4; C S/ 20 000 / −500 / 5; D S/ 18 000 / −400 / 5; E S/ 10 000 / −600 / 6; F S/ 7 000 / −900 / 7. Replantear las duraciones para cumplir el plazo al mínimo costo, calcular el nuevo costo del proyecto y la variación respecto al normal (3 ptos).",
 pasos:[
  "Calcular la duración normal del proyecto y ver cuántos días hay que recortar para llegar a 18.",
  "La pendiente de costo es lo que cuesta cada día ganado; la duración de rotura es el mínimo al que puede llegar la actividad.",
  "Acortar siempre sobre la ruta crítica, empezando por la actividad con menor pendiente de costo (en valor absoluto).",
  "Después de cada recorte, recalcular la ruta crítica: puede aparecer una segunda ruta crítica y entonces hay que recortar en ambas a la vez.",
  "Nuevo costo = costo normal total + suma de (días recortados × pendiente de cada actividad).",
  "Nunca pasar la duración de rotura de una actividad."],
 nota:"En este examen los costos indirectos no entran: la pregunta pide mínimo costo directo para cumplir el plazo."}
];

/* ---------- persistencia ---------- */
const CLAVE = "gdc-cuaderno-v1";
let docDb = null, guardando = null;

function cargarLocal(){
  try{
    const raw = localStorage.getItem(CLAVE);
    if(raw) estado = Object.assign(estado, JSON.parse(raw));
  }catch(e){}
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(estado)); }catch(e){}
  if(!docDb) return;
  clearTimeout(guardando);
  guardando = setTimeout(() => { docDb.set({datos:estado}).catch(() => {}); }, 700);
}
async function conectarDb(){
  const db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
  if(!db) return;
  docDb = db.doc("estado/principal");
  docDb.onSnapshot(snap => {
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    const d = snap.data().datos;
    if(d){ estado = Object.assign({check:{},ej:{},videos:{},extra:[],cards:{}}, d); pintar(); }
  }, () => {});
}

/* ---------- cálculo de avance ---------- */
function itemsDe(t){ return t.check.map((_, i) => t.id + "-c" + i); }
function avanceTema(t){
  const ids = itemsDe(t);
  if(!ids.length) return 0;
  const suma = ids.reduce((a, id) => a + (estado.check[id] || 0), 0);
  return suma / (ids.length * 2);
}
function avanceUnidad(u){
  const ids = u.temas.flatMap(itemsDe);
  if(!ids.length) return 0;
  return ids.reduce((a, id) => a + (estado.check[id] || 0), 0) / (ids.length * 2);
}
function avanceOficial(u){
  if(!u.check || !u.check.length) return 0;
  const s = u.check.reduce((a, _, i) => a + (estado.check[u.id + "-o" + i] || 0), 0);
  return s / (u.check.length * 2);
}
function avanceCurso(){
  const con = CURSO.filter(u => u.check && u.check.length);
  if(!con.length) return 0;
  const tot = con.reduce((a, u) => a + u.check.length, 0);
  const s = con.reduce((a, u) => a + u.check.reduce((b, _, i) => b + (estado.check[u.id + "-o" + i] || 0), 0), 0);
  return s / (tot * 2);
}
function avanceGlobal(){
  const ids = TEMAS.flatMap(itemsDe);
  return ids.reduce((a, id) => a + (estado.check[id] || 0), 0) / (ids.length * 2);
}

}

/* ---------- repaso ---------- */
let mazo = [], indice = 0;
function armarMazo(){
  const peso = c => {
    const s = estado.cards[c.q];
    if(!s) return 1;
    return s.box === 0 ? 3 : s.box === 1 ? 1.5 : 0.5;
  };
  mazo = TARJETAS.slice().map(c => ({c, r:Math.random() / peso(c)}))
    .sort((a, b) => a.r - b.r).slice(0, 15).map(x => x.c);
  indice = 0;
}
function renderRepaso(){
  if(!mazo.length) armarMazo();
  const c = mazo[indice];
  if(!c){
    $("#c-tema").textContent = "";
    $("#c-q").textContent = "Terminaste la ronda.";
    $("#c-a").hidden = true;
    $("#c-ver").hidden = true; $("#c-mal").hidden = true; $("#c-bien").hidden = true;
    $("#c-cont").textContent = "";
    if(!$("#c-otra")){
      const b = document.createElement("button");
      b.className = "btn"; b.id = "c-otra"; b.textContent = "Otra ronda";
      b.onclick = () => { armarMazo(); renderRepaso(); };
      $("#c-ver").parentElement.appendChild(b);
    }
    $("#c-otra").hidden = false;
    return;
  }
  if($("#c-otra")) $("#c-otra").hidden = true;
  const t = porId[c.t];
  $("#c-tema").textContent = t ? t.cod + " · " + t.titulo : "";
  $("#c-q").textContent = c.q;
  $("#c-a").textContent = c.a;
  $("#c-a").hidden = true;
  $("#c-ver").hidden = false; $("#c-mal").hidden = true; $("#c-bien").hidden = true;
  $("#c-cont").textContent = (indice + 1) + " / " + mazo.length;
}
function responder(bien){
  const c = mazo[indice];
  const s = estado.cards[c.q] || {box:0};
  s.box = bien ? Math.min(3, s.box + 1) : 0;
  estado.cards[c.q] = s;
  if(!bien) mazo.push(c);
  indice++;
  guardar(); renderRepaso(); renderHitos();
}

      </div></details>

      <details class="resp-modelo"><summary>2 · Qué es la gestión de proyectos y por qué importa</summary><div>
        <p>Aplicación de conocimientos, habilidades, herramientas y técnicas a las actividades del proyecto para cumplir sus requisitos y alcanzar o superar el valor previsto (PMI). Planificar, organizar, dirigir y controlar (Pierce). Importa porque el éxito no depende del cálculo estructural sino de cumplir alcance, plazo, costo y calidad con los interesados satisfechos; la construcción compite casi por completo en costo, plazo y desempeño.</p>
      </div></details>

      <details class="resp-modelo"><summary>3 · Áreas de enfoque de la gestión de proyectos (PMBOK 2026)</summary><div>
        <p>Grupos de proceso: inicio, planificación, ejecución, seguimiento y control, cierre. Áreas: integración, alcance, tiempo, costo, calidad, equipo de trabajo, comunicaciones, riesgos, adquisiciones e interesados. En inicio y planificación el flujo es: formalizar el proyecto e identificar interesados → recopilar requisitos, definir el alcance, crear la EDT → definir y secuenciar actividades, estimar recursos y duraciones, cronograma → estimar costos y presupuesto → línea base.</p>
      </div></details>

      <details class="resp-modelo"><summary>4 · Identificar y clasificar interesados y armar la matriz de involucramiento</summary><div>
        <p><b>Interesado:</b> persona, grupo u organización que se ve afectado, afecta o se percibe afectado por el proyecto. Se clasifican en internos y externos. Se analizan con cuatro atributos que no hay que confundir: <b>poder</b> (influir en decisiones), <b>interés</b> (compromiso con el entregable), <b>influencia</b> (modificar el comportamiento de otros), <b>impacto</b> (generar cambios en planificación y ejecución).</p>
        <p>Pasos: identificación básica (quién, qué rol) → comprender y analizar (matrices poder/interés, poder/influencia, impacto/influencia) → <b>registro de interesados</b> (clasificación, expectativa de valor redactada desde el interesado, requisitos de información, posición a favor o en contra) → <b>matriz de involucramiento</b>: nivel de participación actual vs. deseado y estrategias concretas para moverlo (reuniones, informes, acceso a información, valorizaciones a tiempo, cuaderno de obra al día).</p>
      </div></details>

      <details class="resp-modelo"><summary>5 · DBB vs. DB: diferencias operativas y de riesgo</summary><div>
        <p><b>DBB (Diseño – Licitación – Construcción):</b> el promotor contrata primero al proyectista, cierra el expediente técnico y luego licita la construcción. Fases en serie, diseño completo antes de construir. Conviene en proyectos de baja complejidad. El promotor asume el riesgo de los errores del diseño: las deficiencias del ET se vuelven adicionales a su cargo.</p>
        <p><b>DB (Diseño – Construcción):</b> un solo contratista diseña y construye. Permite solapar fases y aprovechar que el constructor aporta al diseño. El contratista asume el riesgo del diseño; el promotor pierde control sobre él. El ciclo de vida del proyecto cambia según cuál se elija; la elección depende de la madurez de la información, la complejidad y la asignación de riesgos deseada.</p>
      </div></details>

      <details class="resp-modelo"><summary>6 · Proceso de contratación de obra pública (Ley N° 32069)</summary><div>
        <p>Tres etapas. <b>Actuaciones preparatorias:</b> elaboración del requerimiento → estrategia de contratación → expediente de contratación (anuncio de contratación futura es opcional). <b>Selección:</b> bases administrativas → convocatoria → adjudicación. <b>Ejecución contractual:</b> perfeccionamiento del contrato → ejecución y supervisión (valorizaciones, modificaciones, recepción) → liquidación. Principio rector: <b>valor por el dinero</b>, no solo el menor precio. Plataforma: PLADICOP. Licitación pública para bienes y obras; concurso público para servicios y consultorías.</p>
        <p>Condiciones para que empiece el plazo: comunicación del supervisor, entrega de adelantos, firma de la JPRD y entrega del terreno.</p>
      </div></details>

      <details class="resp-modelo"><summary>7 · Sistemas de entrega y modalidades de pago</summary><div>
        <p><b>Sistemas de entrega:</b> DBB o solo construcción (baja complejidad), DB (el constructor aporta al diseño), IPD (muy alta complejidad), CM como agente y CM con riesgo (alta complejidad), EPC (ingeniería, procura y construcción), APP (concesiones, BOT, DBOM), ejecución directa (la entidad ejecuta). Llave en mano se aplica sobre cualquiera e incluye equipamiento hasta la puesta en servicio.</p>
        <p><b>Modalidades de pago:</b> suma alzada (precio único, exige planos y especificaciones completos, cambios por orden de cambio; el contratista asume el riesgo de metrados), precio unitario (se paga por cantidades reales; la entidad asume el riesgo de metrados), esquema mixto, costo reembolsable.</p>
      </div></details>

      <details class="resp-modelo"><summary>8 · Garantías, adelantos y solución de controversias</summary><div>
        <p><b>Garantía de fiel cumplimiento:</b> asegura a la entidad que el contratista termina la obra según especificaciones; se entrega siempre, pida adelantos o no. Dos formas: <b>carta fianza</b> (banco regulado por la SBS) o <b>retención</b> de pago, solo en obras de más de 60 días y monto menor a 5 millones, retenida en la primera mitad de los pagos y devuelta en la liquidación.</p>
        <p><b>Adelantos:</b> directo (movilización, inicio de operaciones) y para materiales e insumos (compra de materiales clave, protege de la inflación); ambos con carta fianza. <b>Controversias:</b> JPRD (decisiones obligatorias y de cumplimiento inmediato sobre aspectos técnicos y contractuales), conciliación (resolución de contrato, ampliación de plazo, recepción, valorizaciones, liquidación) y arbitraje (validez, nulidad, interpretación, ejecución del contrato).</p>
      </div></details>
    </section>
