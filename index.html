/* ---------- qué cae ---------- */
function totalesPorEje(){
  const t = {};
  EXAMENES.forEach(x => x.preguntas.forEach(q => { t[q.e] = (t[q.e] || 0) + q.p; }));
  return t;
}
function renderQueCae(){
  const tot = totalesPorEje();
  const ejes = Object.keys(EJES).filter(k => tot[k]).sort((a, b) => tot[b] - tot[a]);
  const maxTot = Math.max(...ejes.map(k => tot[k]));
  const granTotal = ejes.reduce((a, k) => a + tot[k], 0);
  const ex = EXAMENES.slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
  const maxCel = Math.max(...ex.flatMap(x => x.preguntas.map(q => q.p)));
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/, "");
  const lider = ejes[0];

  const celda = (x, k) => {
    const qs = x.preguntas.filter(p => p.e === k);
    if(!qs.length) return '<td><span class="celda">·</span></td>';
    const p = qs.reduce((a, b) => a + b.p, 0);
    const i = p / maxCel;
    const bg = "color-mix(in oklab, var(--brand) " + Math.round(12 + i * 78) + "%, var(--surface))";
    return `<td><span class="celda on${i > 0.55 ? " alto" : ""}" style="background:${bg}"
      title="${esc(x.nombre + " " + x.periodo)}: ${fmt(p)} puntos en ${esc(EJES[k].n)}">${fmt(p)}</span></td>`;
  };

  $("#v-quecae").innerHTML = `
  <div class="sec">
    <h2>Qué cae en las evaluaciones</h2>
    <div class="headline">
      <div class="big">${Math.round(tot[lider] / granTotal * 100)}%</div>
      <p>De los ${fmt(granTotal)} puntos repartidos en las ${EXAMENES.length} evaluaciones pasadas que tengo,
      esa proporción se la lleva <strong>${esc(EJES[lider].n)}</strong>, y aparece en
      ${EXAMENES.filter(x => x.preguntas.some(q => q.e === lider)).length} de las ${EXAMENES.length}.
      Es el tema con mejor retorno por hora de estudio.</p>
    </div>

    <div class="scroll-x">
      <table class="matriz">
        <thead><tr><th class="eje">Tema</th>
          ${ex.map(x => `<th>${esc(x.nombre.replace("Práctica", "PC").replace("Examen final", "Final"))}
            <span class="per">${esc(x.periodo)}</span></th>`).join("")}
          <th style="text-align:left">Total</th></tr></thead>
        <tbody>${ejes.map(k => `<tr>
          <th class="eje">${esc(EJES[k].n)}</th>
          ${ex.map(x => celda(x, k)).join("")}
          <td><span class="tot"><i class="b" style="width:${tot[k] / maxTot * 78}px"></i>
            <span class="v">${fmt(tot[k])}</span></span></td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
    <p class="subtle">Puntos sobre 20 por evaluación. Pasa el cursor por una celda para ver el detalle.
    Las celdas con un punto son temas que esa evaluación no tocó.</p>
  </div>

  <div class="sec">
    <h2>Evaluación por evaluación</h2>
    ${ex.slice().reverse().map(x => `<details class="examen">
      <summary><h3>${esc(x.nombre)} · ${esc(x.periodo)}</h3>
        <span class="f">${new Date(x.fecha + "T00:00:00").toLocaleDateString("es-PE", {day:"numeric", month:"long", year:"numeric"})} · ${esc(x.dur)}</span>
        ${x.nota ? `<span class="chip">nota ${esc(x.nota)}</span>` : ""}</summary>
      <div class="qs">${x.preguntas.map(q => `<div class="q">
        <span class="p">${fmt(q.p)} pt</span>
        <span><span class="e">${esc(EJES[q.e].n)}</span>${esc(q.d)}</span>
      </div>`).join("")}</div>
    </details>`).join("")}
    <p class="subtle">Las notas que aparecen son las del alumno que rindió el examen escaneado, no un puntaje de referencia.</p>
  </div>`;
}

/* ---------- pintar y eventos ---------- */
function pintar(){
  renderHitos();
  if(vista === "esencial") renderEsencial();
  if(vista === "temario") renderTemario();
  if(vista === "ejercicios"){ renderFiltros(); renderEjercicios(); }
  if(vista === "quecae") renderQueCae();
  if(vista === "repaso") renderRepaso();
  if(vista === "avance") renderAvance();
}
function cambiarVista(v){
  vista = v;
  ["esencial","temario","ejercicios","quecae","repaso","avance"].forEach(x => {
    $("#v-" + x).hidden = x !== v;
    $("#tab-" + x).setAttribute("aria-selected", String(x === v));
  });
  pintar();
}
["esencial","temario","ejercicios","quecae","repaso","avance"].forEach(x => {
  $("#tab-" + x).addEventListener("click", () => cambiarVista(x));
});

document.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if(!b) return;

  if(b.dataset.unidad){ abiertoU = abiertoU === b.dataset.unidad ? null : b.dataset.unidad; renderTemario(); return; }
  if(b.dataset.abrirU){
    abiertoU = b.dataset.abrirU; renderTemario();
    const el = document.querySelector(`[data-unidad="${abiertoU}"]`); if(el) el.scrollIntoView({block:"start"});
    return;
  }
  if(b.dataset.irEjId){
    cambiarVista("ejercicios"); $("#f-tema").value = ""; $("#f-estado").value = "";
    estado["_ver" + b.dataset.irEjId] = true; renderEjercicios();
    const el = document.querySelector(`[data-sol="${b.dataset.irEjId}"]`); if(el) el.closest(".ej").scrollIntoView({block:"start"});
    return;
  }
  if(b.dataset.tema){ abierto = abierto === b.dataset.tema ? null : b.dataset.tema; renderTemario(); return; }

  if(b.dataset.chk){
    const id = b.dataset.chk;
    estado.check[id] = ((estado.check[id] || 0) + 1) % 3;
    guardar(); renderTemario(); renderHitos(); return;
  }
  if(b.dataset.vidAdd){
    const inp = $("#vid-" + b.dataset.vidAdd);
    if(inp && inp.value.trim()){ estado.videos[b.dataset.vidAdd] = inp.value.trim(); guardar(); renderTemario(); }
    return;
  }
  if(b.dataset.vidDel){ delete estado.videos[b.dataset.vidDel]; guardar(); renderTemario(); return; }
  if(b.dataset.irEj){ cambiarVista("ejercicios"); $("#f-tema").value = b.dataset.irEj; renderEjercicios(); return; }

  if(b.dataset.sol){ estado["_ver" + b.dataset.sol] = !estado["_ver" + b.dataset.sol]; renderEjercicios(); return; }
  if(b.dataset.est){
    const [id, st] = b.dataset.est.split("|");
    estado.ej[id] = estado.ej[id] === st ? "pendiente" : st;
    guardar(); renderEjercicios(); renderHitos(); return;
  }
  if(b.dataset.borrar){
    estado.extra = (estado.extra || []).filter(e => e.id !== b.dataset.borrar);
    guardar(); renderFiltros(); renderEjercicios(); renderHitos(); return;
  }
});

$("#f-tema").addEventListener("change", renderEjercicios);
$("#f-estado").addEventListener("change", renderEjercicios);
$("#btn-nuevo").addEventListener("click", () => { $("#form-ej").hidden = !$("#form-ej").hidden; });
$("#ne-cancel").addEventListener("click", () => { $("#form-ej").hidden = true; });
$("#form-ej").addEventListener("submit", ev => {
  ev.preventDefault();
  const sol = $("#ne-sol").value.trim();
  estado.extra = estado.extra || [];
  estado.extra.push({
    id:"p" + Date.now(),
    tema:$("#ne-tema").value,
    origen:$("#ne-org").value.trim() || "Agregado por mí",
    enunciado:$("#ne-enun").value.trim(),
    pasos:sol ? sol.split("\n").filter(x => x.trim()) : [],
    verif:"propuesta"
  });
  guardar();
  ev.target.reset(); $("#form-ej").hidden = true;
  renderFiltros(); renderEjercicios(); renderHitos();
});

$("#c-ver").addEventListener("click", () => {
  $("#c-a").hidden = false;
  $("#c-ver").hidden = true;
  $("#c-mal").hidden = false; $("#c-bien").hidden = false;
});
$("#c-mal").addEventListener("click", () => responder(false));
$("#c-bien").addEventListener("click", () => responder(true));

cargarLocal();
if(diasHasta(PC1.fecha) >= 0) cambiarVista("esencial"); else pintar();
conectarDb();
</script>

</html>
